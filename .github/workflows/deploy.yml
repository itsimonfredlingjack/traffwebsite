name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # Builds the site and runs the SEO checks. Runs on pull requests too,
  # and the deploy job below only starts if this one is green.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - name: Build site
        run: npm run build
        env:
          VITE_BASE: /
          SITE_URL: https://xn--trff-moa.app/

      - name: Validate JSON-LD
        run: node scripts/validate-jsonld.mjs

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Install fonts for citation-coverage
        # citation-coverage.spec.js reads NimbusSans-Regular.afm to measure text widths.
        # It lands in /usr/share/fonts/type1/urw-base35/ on Ubuntu.
        run: sudo apt-get update && sudo apt-get install -y fonts-urw-base35

      - name: SEO and citation-coverage tests
        run: npx playwright test tests/seo-regression.spec.js tests/citation-coverage.spec.js
        env:
          CI: 'true'

      - name: Lighthouse
        # Uses the Chromium that Playwright installed above.
        run: CHROME_PATH="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")" npm run lighthouse

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/

  deploy:
    needs: verify
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        # Project Pages serves this repo at /traffwebsite/.
        # traff.app is not the published host yet; see README for the switch.
        run: npm run build
        env:
          VITE_BASE: /
          SITE_URL: https://xn--trff-moa.app/
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
